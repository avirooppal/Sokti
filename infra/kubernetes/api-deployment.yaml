apiVersion: apps/v1
kind: Deployment
metadata:
  name: sokti-semantic-search-api
  namespace: sokti-data
  labels:
    app: sokti-semantic-search-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sokti-semantic-search-api
  template:
    metadata:
      labels:
        app: sokti-semantic-search-api
    spec:
      containers:
        - name: api
          image: sokti/semantic-search-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PGVECTOR_HOST
              value: "postgres-pgvector.sokti-data.svc.cluster.local"
            - name: PGVECTOR_PORT
              value: "5432"
            - name: CLICKHOUSE_HOST
              value: "clickhouse.sokti-data.svc.cluster.local"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sokti-semantic-search-api
  namespace: sokti-data
spec:
  selector:
    app: sokti-semantic-search-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
